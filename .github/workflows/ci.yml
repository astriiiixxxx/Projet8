name: CI — Tests unitaires

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read
  checks: write

jobs:
  test-java:
    name: Tests Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Rendre run-tests.sh exécutable
        run: chmod +x ./G-rez-l-int-gration-et-la-livraison-continue-Application-Java-main/run-tests.sh
      - name: Exécuter les tests Java
        run: ./G-rez-l-int-gration-et-la-livraison-continue-Application-Java-main/run-tests.sh ./G-rez-l-int-gration-et-la-livraison-continue-Application-Java-main
      - name: Publier les rapports JUnit
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: "Tests Java"
          path: "G-rez-l-int-gration-et-la-livraison-continue-Application-Java-main/test-results/**/*.xml"
          reporter: java-junit
          token: ${{ secrets.GITHUB_TOKEN }}

  test-angular:
    name: Tests Angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: G-rez-l-int-gration-et-la-livraison-continue-Application-Angular-main/package-lock.json
      - name: Rendre run-tests.sh exécutable
        run: chmod +x ./G-rez-l-int-gration-et-la-livraison-continue-Application-Angular-main/run-tests.sh
      - name: Exécuter les tests Angular
        run: ./G-rez-l-int-gration-et-la-livraison-continue-Application-Angular-main/run-tests.sh ./G-rez-l-int-gration-et-la-livraison-continue-Application-Angular-main
      - name: Publier les rapports JUnit
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: "Tests Angular"
          path: "G-rez-l-int-gration-et-la-livraison-continue-Application-Angular-main/test-results/**/*.xml"
          reporter: java-junit
          token: ${{ secrets.GITHUB_TOKEN }}

  # =============================================================================
  # Job : Build & Push image Docker — Java
  # Se lance uniquement si les tests Java ont réussi (needs: test-java).
  # =============================================================================
  build-java:
    name: Build Docker — Java
    needs: test-java
    runs-on: ubuntu-latest

    # Permissions nécessaires pour pousser vers ghcr.io via GITHUB_TOKEN :
    # - contents: read  → checkout du code
    # - packages: write → push de l'image sur le GitHub Container Registry
    permissions:
      contents: read
      packages: write

    steps:

      # ── 1. Checkout ────────────────────────────────────────────────────────
      # Récupère le code source (dont le Dockerfile de l'app Java).
      - name: Checkout du code source
        uses: actions/checkout@v4

      # ── 2. Authentification sur ghcr.io ───────────────────────────────────
      # GITHUB_TOKEN est injecté automatiquement par GitHub Actions.
      # Il a les droits "packages: write" accordés ci-dessus.
      # Aucun secret custom n'est nécessaire pour ghcr.io.
      - name: Login vers GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 3. Extraction des métadonnées Docker ──────────────────────────────
      # metadata-action génère automatiquement les tags et labels OCI.
      # Deux stratégies de tag combinées :
      #   - type=ref,event=branch → nom de la branche (ex: test-pipeline)
      #   - type=sha,format=short → SHA court du commit (ex: bbd5e22)
      # Résultat combiné : ghcr.io/astriiiixxxx/projet8-java:test-pipeline-bbd5e22
      - name: Extraire les métadonnées Docker (tags & labels)
        id: meta-java
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/astriiiixxxx/projet8-java
          tags: |
            type=ref,event=branch
            type=sha,format=short
          # Les labels OCI (org.opencontainers.*) sont ajoutés automatiquement
          # et permettent à GitHub d'associer l'image au repo source.

      # ── 4. Build & Push de l'image ────────────────────────────────────────
      # Construit l'image depuis le Dockerfile du sous-dossier Java
      # et la pousse directement vers ghcr.io avec les tags générés ci-dessus.
      - name: Build et push de l'image Docker Java
        uses: docker/build-push-action@v5
        with:
          context: ./G-rez-l-int-gration-et-la-livraison-continue-Application-Java-main
          push: true
          tags: ${{ steps.meta-java.outputs.tags }}
          labels: ${{ steps.meta-java.outputs.labels }}

  # =============================================================================
  # Job : Build & Push image Docker — Angular
  # Se lance uniquement si les tests Angular ont réussi (needs: test-angular).
  # =============================================================================
  build-angular:
    name: Build Docker — Angular
    needs: test-angular
    runs-on: ubuntu-latest

    # Mêmes permissions que build-java : lecture du code + écriture sur ghcr.io.
    permissions:
      contents: read
      packages: write

    steps:

      # ── 1. Checkout ────────────────────────────────────────────────────────
      # Récupère le code source (dont le Dockerfile de l'app Angular / NGINX).
      - name: Checkout du code source
        uses: actions/checkout@v4

      # ── 2. Authentification sur ghcr.io ───────────────────────────────────
      # Même mécanique que pour Java : GITHUB_TOKEN suffit, zéro secret custom.
      - name: Login vers GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 3. Extraction des métadonnées Docker ──────────────────────────────
      # Produit les mêmes types de tags que pour Java, sur l'image Angular.
      # Résultat : ghcr.io/astriiiixxxx/projet8-angular:test-pipeline-bbd5e22
      - name: Extraire les métadonnées Docker (tags & labels)
        id: meta-angular
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/astriiiixxxx/projet8-angular
          tags: |
            type=ref,event=branch
            type=sha,format=short

      # ── 4. Build & Push de l'image ────────────────────────────────────────
      # Construit depuis le Dockerfile du sous-dossier Angular (servi par NGINX)
      # et pousse vers ghcr.io avec les tags et labels générés.
      - name: Build et push de l'image Docker Angular
        uses: docker/build-push-action@v5
        with:
          context: ./G-rez-l-int-gration-et-la-livraison-continue-Application-Angular-main
          push: true
          tags: ${{ steps.meta-angular.outputs.tags }}
          labels: ${{ steps.meta-angular.outputs.labels }}